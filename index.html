<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎉 Joyeux Anniversaire !</title>

  <!-- Three.js Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
      }
    }
  </script>

  <style>
    /* =============== GLOBAL =============== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', 'Lato', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    #container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* =============== GLOW LAYERS =============== */
    .bg-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .glow-1 {
      background: radial-gradient(
        circle at 50% 50%,
        rgba(255, 0, 50, 0.08) 0%,
        transparent 45%
      );
    }

    .glow-2 {
      background: radial-gradient(
        circle at 30% 70%,
        rgba(255, 150, 0, 0.05) 0%,
        transparent 50%
      );
    }

    /* =============== TITLE & NAME =============== */
    .header {
      position: fixed;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 20;
      opacity: 0;
      animation: fadeInHeader 2s 1.2s forwards;
    }

    .subtitle {
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 3px;
      color: #ff99aa;
      text-shadow: 0 0 10px rgba(255, 100, 130, 0.7);
      margin-bottom: 10px;
    }

    .name {
      font-size: 4.2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ff4477, #ffd700, #ff4477);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(255, 68, 119, 0.5);
      letter-spacing: 2px;
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    @keyframes fadeInHeader {
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* =============== HEART TEXT =============== */
    .heart-message {
      position: fixed;
      top: 32%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.6rem;
      font-weight: 400;
      color: #ffd700;
      text-shadow:
        0 0 8px rgba(255, 215, 0, 0.8),
        0 0 16px rgba(255, 100, 100, 0.6);
      z-index: 18;
      opacity: 0;
      animation: fadeIn 2s 5s forwards;
    }

    /* =============== CAKE =============== */
    #cake-svg {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: auto;
      z-index: 16;
      pointer-events: none;
      opacity: 0;
      animation: cakeAppear 1.8s 2.8s forwards;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
    }

    /* Candle flame flicker */
    .fuego {
      animation: fuego 1.2s infinite alternate ease-in-out;
      filter: brightness(1.2);
    }

    .fuego:nth-child(1) { animation-delay: 0s; }
    .fuego:nth-child(2) { animation-delay: 0.1s; }
    .fuego:nth-child(3) { animation-delay: 0.2s; }
    .fuego:nth-child(4) { animation-delay: 0.3s; }
    .fuego:nth-child(5) { animation-delay: 0.4s; }

    @keyframes fuego {
      0%, 100% {
        transform: scale(1, 1) translateY(0);
        opacity: 1;
      }
      50% {
        transform: scale(1.1, 1.3) translateY(-2px);
        opacity: 0.9;
      }
    }

    @keyframes cakeAppear {
      0% { opacity: 0; transform: translateX(-50%) scale(0.7) translateY(50px); }
      70% { transform: translateX(-50%) scale(1.05) translateY(-5px); }
      100% { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
    }

    /* =============== BALLOONS =============== */
    .balloons {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .balloon {
      position: absolute;
      width: 18px;
      height: 28px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: linear-gradient(135deg, #ff2255, #ff0000);
      box-shadow:
        0 0 6px rgba(255, 100, 150, 0.7),
        inset -2px -2px 4px rgba(255, 255, 255, 0.2);
      animation: floatUp linear infinite;
    }

    .balloon.gold { background: linear-gradient(135deg, #ffd700, #ffaa00); }
    .balloon.pink { background: linear-gradient(135deg, #ff99cc, #ff6699); }
    .balloon.purple { background: linear-gradient(135deg, #cc99ff, #9966ff); }

    .balloon::before {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 1.5px;
      height: 35px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 2px;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      15% { opacity: 1; }
      95% { opacity: 0.8; }
      100% { transform: translateY(-120px) translateX(var(--dx)); opacity: 0; }
    }

    /* =============== CONTROLS =============== */
    #controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 18px;
      z-index: 100;
      background: rgba(15, 5, 20, 0.65);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 100, 150, 0.3);
      border-radius: 20px;
      padding: 12px 20px;
      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.5),
        inset 0 0 10px rgba(255, 50, 100, 0.1);
      transition: all 0.4s ease;
    }

    #controls:hover {
      background: rgba(25, 10, 35, 0.75);
      border-color: rgba(255, 120, 160, 0.5);
      box-shadow:
        0 6px 25px rgba(0, 0, 0, 0.6),
        inset 0 0 15px rgba(255, 80, 130, 0.2);
    }

    .separator {
      width: 1px;
      height: 26px;
      background: linear-gradient(to bottom, transparent, rgba(255, 100, 150, 0.4), transparent);
    }

    .theme-btn,
    .action-btn {
      padding: 8px 18px;
      border: none;
      border-radius: 14px;
      background: rgba(40, 10, 30, 0.6);
      color: #ffd7aa;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      backdrop-filter: blur(4px);
    }

    .theme-btn:hover,
    .action-btn:hover {
      background: rgba(60, 20, 50, 0.8);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(255, 80, 120, 0.4);
    }

    .theme-btn.active {
      background: linear-gradient(90deg, #ff0033, #ff6699);
      color: white;
      box-shadow: 0 0 12px rgba(255, 0, 80, 0.6);
    }

    /* Toggle */
    .toggle-option {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
      color: #ffccdd;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(50, 10, 30, 0.7);
      transition: 0.3s;
      border-radius: 26px;
      border: 1px solid rgba(255, 100, 150, 0.3);
    }

    .toggle-slider:before {
      position: absolute;
      content: '';
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 2px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(255, 150, 200, 0.7);
      transition: 0.3s;
    }

    input:checked + .toggle-slider {
      background: linear-gradient(90deg, #ff0033, #ff3366);
    }

    input:checked + .toggle-slider:before {
      transform: translateX(22px);
      background: #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.9);
    }

    /* =============== FOOTER =============== */
    .footer {
      position: fixed;
      bottom: 8px;
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      color: rgba(255, 200, 220, 0.6);
      z-index: 9;
      pointer-events: none;
    }

    /* =============== RESPONSIVE =============== */
    @media (max-width: 768px) {
      .name { font-size: 2.8rem; }
      .subtitle { font-size: 1.1rem; }
      .heart-message { font-size: 1.3rem; top: 36%; }
      #cake-svg { width: 160px; bottom: 80px; }
      #controls { gap: 10px; padding: 10px 14px; flex-wrap: wrap; }
      .separator { display: none; }
    }
    

    /* =============== FONTS =============== */
    @import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;400;600;700;900&display=swap');
  </style>
</head>

    function initAudioContext() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        fetch(HAPPY_BIRTHDAY_BASE64)
          .then(res => res.arrayBuffer())

          .then(buffer => {

          })
          .catch(e => console.warn("Audio load failed", e));
      } catch (e) {
        console.warn("AudioContext non supporté", e);
      }
    }

    function playBirthdaySound() {
      if (!document.getElementById('soundToggle')?.checked || !birthdayBuffer) return;
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(console.warn);
      }
      const source = audioCtx.createBufferSource();
      source.buffer = birthdayBuffer;
      source.connect(audioCtx.destination);
      source.start(0);
      console.log("🎂 Musique d'anniversaire lancée !");
    }

    // =============== HEART PATH ===============
    function createHeartPath(particleIndex, totalParticles) {
      const t = (particleIndex / totalParticles) * Math.PI * 2;
      const scale = 3.2;
      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      const finalX = x * scale;
      const finalY = y * scale;
      const z = Math.sin(t * 3) * 1.8;
      const jitter = 0.25;
      return new THREE.Vector3(
        finalX + (Math.random() - 0.5) * jitter,
        finalY + (Math.random() - 0.5) * jitter,
        z + (Math.random() - 0.5) * jitter * 0.4
      );
    }

        btn.dataset.theme = key;
        btn.textContent = theme.name;
        btn.addEventListener('click', () => setTheme(key));
        selector.appendChild(btn);
      });

      // Toggles
      document.getElementById('animateToggle').addEventListener('change', (e) => {
        isAnimationEnabled = e.target.checked;
        if (!isAnimationEnabled) {
          renderer.setAnimationLoop(null);
        } else {
          animate();
        }
      });

      const sizes = new Float32Array(particleCount);
      const heartPositions = new Float32Array(particleCount * 3);
      const disintegrationOffsets = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const heartPos = createHeartPath(i, particleCount);
        
        heartPositions[i3] = heartPos.x;
        heartPositions[i3 + 1] = heartPos.y;
        heartPositions[i3 + 2] = heartPos.z;

        positions[i3] = heartPos.x;
        positions[i3 + 1] = heartPos.y;
        positions[i3 + 2] = heartPos.z;

        const { color, size } = getAttributesForParticle(i);
        colors[i3] = color.r;
        colors[i3 + 1] = color.g;
        colors[i3 + 2] = color.b;
        sizes[i] = size;

        const offsetStrength = 45 + Math.random() * 35;
        const phi = Math.random() * Math.PI * 2;
        const theta = Math.acos(2 * Math.random() - 1);
        disintegrationOffsets[i3] = Math.sin(theta) * Math.cos(phi) * offsetStrength;
        disintegrationOffsets[i3 + 1] = Math.sin(theta) * Math.sin(phi) * offsetStrength;
        disintegrationOffsets[i3 + 2] = Math.cos(theta) * offsetStrength * 0.4;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
      geometry.setAttribute('heartPosition', new THREE.BufferAttribute(heartPositions, 3));
      geometry.setAttribute('disintegrationOffset', new THREE.BufferAttribute(disintegrationOffsets, 3));

      const texture = createParticleTexture();
      const material = new THREE.PointsMaterial({
        size: 4.0,
        map: texture,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true,
        alphaTest: 0.01
      });

      particles = new THREE.Points(geometry, material);
      scene.add(particles);
    }

    function getAttributesForParticle(i) {
      const t = i / particleCount;
      const colorPalette = themes[currentTheme].colors;
      const colorProgress = (t * colorPalette.length * 1.8 + time * 0.08) % colorPalette.length;
      const idx1 = Math.floor(colorProgress);
      const idx2 = (idx1 + 1) % colorPalette.length;
      const blend = colorProgress - idx1;
      const baseColor = new THREE.Color().lerpColors(colorPalette[idx1], colorPalette[idx2], blend);
      const color = baseColor.clone().multiplyScalar(0.85 + Math.random() * 0.3);
      const size = 0.8 + Math.random() * 0.7;
      return { color, size };
    }

    function createParticleTexture() {
      const canvas = document.createElement('canvas');
      const size = 64;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const cx = size / 2;
      const cy = size / 2;
      const r = size * 0.5;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.3, 'rgba(255, 200, 200, 0.9)');
      grad.addColorStop(0.7, 'rgba(255, 100, 100, 0.7)');
      grad.addColorStop(1, 'rgba(255, 0, 50, 0)');
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    // =============== CONFETTI ===============
    function burstConfetti(extra = false) {
      if (!extra && hasBurst) return;
      if (!extra) hasBurst = true;

      const count = extra ? 1000 : 600;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      const colors = [
        0xff0033, 0xffd700, 0xff6699, 0x9966ff, 
        0x66ffcc, 0xffffff, 0xffaa00
      ];

      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        pos[i3] = (Math.random() - 0.5) * 50;
        pos[i3 + 1] = (Math.random() - 0.5) * 50;
        pos[i3 + 2] = (Math.random() - 0.5) * 50;
        const c = new THREE.Color(colors[Math.floor(Math.random() * colors.length)]);
        col[i3] = c.r;
        col[i3 + 1] = c.g;
        col[i3 + 2] = c.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

      const mat = new THREE.PointsMaterial({
        size: extra ? 1.6 : 2.0,
        vertexColors: true,
        transparent: true,
        opacity: 0.98
      });

      const confetti = new THREE.Points(geo, mat);
      scene.add(confetti);

      let life = 0;
      const duration = extra ? 1.2 : 1.8;
      const animate = () => {
        life += 0.016;
        if (life > duration) {
          scene.remove(confetti);
          return;
        }
        const attr = confetti.geometry.attributes.position;
        for (let i = 0; i < count; i++) {
          const i3 = i * 3;
          attr.array[i3] += (Math.random() - 0.5) * 0.4;
          attr.array[i3 + 1] += (Math.random() * 0.8 + 0.4) * 0.4;
          attr.array[i3 + 2] += (Math.random() - 0.5) * 0.4;
        }
        attr.needsUpdate = true;
        confetti.material.opacity = 0.98 * (1 - Math.pow(life / duration, 1.5));
        requestAnimationFrame(animate);
      };
      animate();
    }

    // =============== ANIMATION ===============
    function animateParticles() {
      if (!particles || !isAnimationEnabled) return;

      const pos = particles.geometry.attributes.position.array;
      const heartPos = particles.geometry.attributes.heartPosition.array;
      const colors = particles.geometry.attributes.color.array;
      const sizes = particles.geometry.attributes.size.array;
      const offsets = particles.geometry.attributes.disintegrationOffset.array;

      let justReassembled = false;

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const homeX = heartPos[i3];
        const homeY = heartPos[i3 + 1];
        const homeZ = heartPos[i3 + 2];

        const cycle = 22.0;
        const phase = ((time * 0.55 + i * 0.0004) % cycle) / cycle;
        let disintegrate = 0;
        if (phase < 0.42) disintegrate = 0;
        else if (phase < 0.58) disintegrate = (phase - 0.42) / 0.16;
        else if (phase < 0.78) disintegrate = 1.0;
        else disintegrate = 1.0 - (phase - 0.78) / 0.22;
        disintegrate = Math.sin(disintegrate * Math.PI * 0.5);

        if (i === 0 && disintegrate < 0.05 && phase > 0.96 && !hasBurst && userHasInteracted) {
          justReassembled = true;
        }

        const targetX = homeX + offsets[i3] * disintegrate;
        const targetY = homeY + offsets[i3 + 1] * disintegrate;
        const targetZ = homeZ + offsets[i3 + 2] * disintegrate;

        const lerp = disintegrate > 0.1 ? 0.05 : 0.12;
        pos[i3] += (targetX - pos[i3]) * lerp;
        pos[i3 + 1] += (targetY - pos[i3 + 1]) * lerp;
        pos[i3 + 2] += (targetZ - pos[i3 + 2]) * lerp;

        const { color, size } = getAttributesForParticle(i);
        let bright = (0.8 + Math.sin((i / particleCount) * Math.PI * 8 + time * 1.5) * 0.5) * (1 - disintegrate * 0.7);
        bright *= 0.8 + Math.sin(time * 6 + i * 0.4) * 0.2;
        colors[i3] = color.r * bright;
        colors[i3 + 1] = color.g * bright;
        colors[i3 + 2] = color.b * bright;

        let curSize = size * (1 - disintegrate * 0.7);
        curSize *= 0.8 + Math.sin(time * 4 + i * 0.3) * 0.2;
        sizes[i] = Math.max(0.1, curSize);
      }

      particles.geometry.attributes.position.needsUpdate = true;
      particles.geometry.attributes.color.needsUpdate = true;
      particles.geometry.attributes.size.needsUpdate = true;

      if (justReassembled) {
        burstConfetti();
        playBirthdaySound();
      }
    }

    function animate() {
      if (!isAnimationEnabled) return;
      requestAnimationFrame(animate);
      time += 0.018;
      controls.update();
      animateParticles();
      composer.render();
    }

    // =============== UTILS ===============
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    }

    function setTheme(themeName) {
      if (!themes[themeName]) return;
      currentTheme = themeName;
      document.body.className = `theme-${currentTheme}`;
      document.querySelectorAll('.theme-btn').forEach(btn =>
        btn.classList.toggle('active', btn.dataset.theme === themeName)
      );

      const theme = themes[currentTheme];
      const bloomPass = scene.userData.bloomPass;
      if (bloomPass) {
        bloomPass.strength = theme.bloom.strength;
        bloomPass.radius = theme.bloom.radius;
        bloomPass.threshold = theme.bloom.threshold;
      }
      updateParticleColorsAndSizes();
    }

    function updateParticleColorsAndSizes() {
      if (!particles) return;
      const pColors = particles.geometry.attributes.color.array;
      const pSizes = particles.geometry.attributes.size.array;
      for (let i = 0; i < particleCount; i++) {
        const { color, size } = getAttributesForParticle(i);
        const i3 = i * 3;
        pColors[i3] = color.r;
        pColors[i3 + 1] = color.g;
        pColors[i3 + 2] = color.b;
        pSizes[i] = size;
      }
      particles.geometry.attributes.color.needsUpdate = true;
      particles.geometry.attributes.size.needsUpdate = true;
    }

    function onKeyDown(e) {
      const key = e.key.toLowerCase();
      if (key === 'b') {
        burstConfetti(true);
        document.querySelector('.heart-message').innerText = "✨ Surprise ! ✨";
        setTimeout(() => document.querySelector('.heart-message').innerText = "❤️ Joyeux Anniversaire ! ❤️", 2000);
      } else if (key === 'h') {
        camera.position.z = 220;
        controls.reset();
      } else if (key === 'c') {
        const cake = document.getElementById('cake-container');
        cake.style.animation = 'none';
        setTimeout(() => cake.style.animation = 'cakeAppear 0.5s forwards', 10);
      }
    }

    // =============== START ===============
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
